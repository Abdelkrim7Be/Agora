version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/services/gateway"
    schedule:
      interval: "weekly"
    ignore:
      # Not CVE-driven; needs a deliberate migration (jjwt-jackson still
      # drags in old Jackson 2.x, breaks classpath resolution in auth code).
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/services/email-agent"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/services/security"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/services/platform-core"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/services/web-react"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/email-agent"
    schedule:
      interval: "weekly"
    ignore:
      # platform-core pins requires-python <3.12 project-wide; not CVE-driven.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/security"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/web-react"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
