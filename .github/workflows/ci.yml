name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  email-agent:
    name: email-agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/email-agent
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      OPENAI_API_KEY: "ci-dummy"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/ -q

  security:
    name: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/security
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      OPENAI_API_KEY: "ci-dummy"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/ -q

  gateway:
    name: gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
