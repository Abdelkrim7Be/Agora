name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  email-agent:
    name: email-agent
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agora_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/email-agent
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      OPENAI_API_KEY: "ci-dummy"
      PYTHONPATH: "."
      RLS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/agora_ci
      RLS_TEST_APP_URL: postgresql://agora_email_agent:agent-test-password@localhost:5432/agora_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ../platform-core
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/ -q
      - run: python -m eval.run_eval --max-attack-success-rate 0.0

  security:
    name: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/security
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      OPENAI_API_KEY: "ci-dummy"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/ -q

  infra:
    name: infra TLS boundary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pyyaml==6.0.2
      - run: python -m unittest discover -s tests -v

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1

  dependency-image-scan:
    name: dependency and image scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependency manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          skip-dirs: .trivy-cache,node_modules,services/email-agent/.venv,services/security/.venv,agent-IA-ETHIK-PORTAGE-
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build service image
        run: docker build --pull -t agora-${{ matrix.image }}:ci -f services/${{ matrix.context }}/Dockerfile ${{ matrix.build-context || format('services/{0}', matrix.context) }}
      - name: Scan service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          image-ref: agora-${{ matrix.image }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: email-agent
            context: email-agent
            # Dockerfile COPYs platform-core/ as a sibling of email-agent/, so
            # the build context has to be the parent services/ dir.
            build-context: services
          - image: security
            context: security
          - image: gateway
            context: gateway
          - image: web-react
            context: web-react

  web-react:
    name: web-react
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/web-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  gateway:
    name: gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
