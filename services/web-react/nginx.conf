map $http_x_forwarded_proto $agora_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Docker embedded DNS; the variable defers resolution to request time so
    # nginx starts even if the gateway container is still booting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
        # Always revalidate (ETag/304): deploys reach clients on next load
        # instead of being pinned by the browser's heuristic cache.
        add_header Cache-Control "no-cache";
    }

    # Same-origin API: the browser talks only to this host; nginx forwards to
    # the gateway inside the compose network. Keeps HTTPS deployments free of
    # mixed-content and hardcoded ports.
    # NB: every gateway path must be listed here. A missing one is served the SPA
    # shell instead, so the client parses HTML as JSON and the page crashes.
    location ~ ^/(api/|auth/|audit|users|me|agents|agent-instances|mailboxes|health) {
        set $gateway_upstream gateway:8080;
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $agora_forwarded_proto;
        # SSE streams (run respond/stream) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
