spring:
  application:
    name: gateway
  config:
    import: optional:configtree:${GATEWAY_SECRET_DIR:/run/secrets/agora-gateway/}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:agora}
    username: ${POSTGRES_USER:agora}
    password: ${POSTGRES_PASSWORD:agora}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      # The proxy forwards multipart bodies as raw bytes; Spring's multipart
      # resolver must not consume/parse them first. Size is capped in
      # ProxyController (MAX_PROXY_BODY_BYTES) instead.
      enabled: false

server:
  port: 8080

gateway:
  upstream:
    email-agent-url: ${GATEWAY_UPSTREAM_EMAIL_AGENT_URL:http://localhost:8000}
    # Raise this wherever the model runs on CPU: a tone rewrite or a redraft can
    # take several minutes there, and aborting mid-inference leaves the browser
    # on a spinner while the agent is still working on the answer.
    response-timeout-seconds: ${GATEWAY_UPSTREAM_TIMEOUT_SECONDS:150}
  default-agent-instance: ${GATEWAY_DEFAULT_AGENT_INSTANCE:default-email-agent}
  # Mailbox the seeded instance expects OAuth to authorize. Blank means "no
  # expectation" — whichever mailbox the user connects is accepted. A non-blank
  # value is compared against the address Google reports and fails closed on a
  # mismatch, so only set it to a real address, never a placeholder.
  default-agent-mailbox: ${GATEWAY_DEFAULT_AGENT_MAILBOX:}
  # Public base URL of the web app; invitation links are built from it.
  app-url: ${GATEWAY_APP_URL:http://localhost:5173}
  invite-expiry-hours: ${GATEWAY_INVITE_EXPIRY_HOURS:48}
  smtp:
    # Leave host/from blank to run without a relay: the invitation endpoints
    # then return the setup link for an admin to deliver by hand.
    host: ${GATEWAY_SMTP_HOST:}
    port: ${GATEWAY_SMTP_PORT:587}
    username: ${GATEWAY_SMTP_USERNAME:}
    password: ${GATEWAY_SMTP_PASSWORD:}
    from: ${GATEWAY_SMTP_FROM:}
  agent-types:
    - id: email-agent
      display-name: Email Agent
      description: Trie les e-mails, rédige les réponses, apprend votre style et gère la boîte mail, chaque envoi restant sous validation.
      capabilities:
        - email_triage
        - draft_approval
        - gmail_sync
        - style_learning
        - cost_observability
      base-path: /api/agent
      health-path: /health
      manifest-path: /manifest
      # Everything below is the offline fallback. The agent declares the same
      # fields at `manifest-path` and that declaration wins; this is what the
      # platform shows when the service is down or speaks a newer contract.
      settings-schema:
        - key: persona
          label: Persona
          description: Background, triage rules, response preferences and writing style.
          path: /persona
        - key: categories
          label: Categories
          description: Workflow categories, routing, policies and templates.
          path: /categories
        - key: rules
          label: Rules
          description: Deterministic automation, starter rules, digest and follow-up settings.
          path: /rules
        - key: capabilities
          label: Capabilities
          description: Enabled tools and approval gates for this agent instance.
          path: /capabilities
        - key: permissions
          label: Permissions
          description: Per-instance mailbox access grants.
          path: /permissions
      color: "#38bdf8"
      icon: mail
  jwt:
    secret: ${GATEWAY_JWT_SECRET:}
    ttl-minutes: ${GATEWAY_JWT_TTL_MINUTES:15}
    refresh-ttl-days: ${GATEWAY_JWT_REFRESH_TTL_DAYS:7}
    secure-cookies: ${GATEWAY_JWT_SECURE_COOKIES:true}
  agent-shared-secret: ${GATEWAY_AGENT_SHARED_SECRET:}
  mfa:
    challenge-ttl-minutes: ${GATEWAY_MFA_CHALLENGE_TTL_MINUTES:5}
    recovery-code-count: ${GATEWAY_MFA_RECOVERY_CODE_COUNT:8}
  login-rate-limit:
    enabled: ${GATEWAY_LOGIN_RATELIMIT_ENABLED:true}
    window-seconds: ${GATEWAY_LOGIN_RATELIMIT_WINDOW_SECONDS:900}
    max-failures: ${GATEWAY_LOGIN_RATELIMIT_MAX_FAILURES:5}
    global-max-failures: ${GATEWAY_LOGIN_RATELIMIT_GLOBAL_MAX_FAILURES:100}
  # Seeded accounts. The optional email is what lets the team page invite,
  # re-invite or reach them; it is backfilled onto an account seeded before it
  # was configured, and never overwrites an address already set.
  owner:
    username: ${GATEWAY_OWNER_USERNAME:}
    password: ${GATEWAY_OWNER_PASSWORD:}
    email: ${GATEWAY_OWNER_EMAIL:}
  viewer:
    username: ${GATEWAY_VIEWER_USERNAME:}
    password: ${GATEWAY_VIEWER_PASSWORD:}
    email: ${GATEWAY_VIEWER_EMAIL:}
  admin:
    username: ${GATEWAY_ADMIN_USERNAME:}
    password: ${GATEWAY_ADMIN_PASSWORD:}
    email: ${GATEWAY_ADMIN_EMAIL:}
