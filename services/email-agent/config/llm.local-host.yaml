endpoint: "http://host.docker.internal:11434/v1"
temperature: 0.0
# Bounded replies so a draft takes seconds, not minutes.
max_tokens: 700
timeout: 300
# qwen3:4b-8k for every role: single resident model on the 4GB GPU (no VRAM
# swap between calls), and a clear quality jump over qwen2.5:3b for French
# drafting and instruction-following on retouches.
#
# Was qwen3:4b-4k for triage/quarantine/draft/reason until a live poller sweep
# of a real backlog (109 emails) hit "request (6240 tokens) exceeds the
# available context size (4096 tokens)" on the large majority of them — the
# 2207-token p95 this cap was sized against did not hold under real inbox
# traffic. Pointing every role at the same -8k tag as memory_style (already
# proven resident) avoids reintroducing the two-model eviction-thrash problem
# this comment used to warn about, while giving triage/draft the headroom
# memory_style already needed.
roles:
  triage: "openai:qwen3:4b-8k"
  quarantine: "openai:qwen3:4b-8k"
  # Draft role: slightly creative. qwen3's structured (JSON) drafts need more
  # completion room than qwen2.5 — a 550 cap truncated the JSON mid-draft and
  # every redraft failed to parse.
  draft:
    model: "openai:qwen3:4b-8k"
    temperature: 0.3
    max_tokens: 1100
  reason: "openai:qwen3:4b-8k"
  memory_style: "openai:qwen3:4b-8k"
fallbacks: {}
