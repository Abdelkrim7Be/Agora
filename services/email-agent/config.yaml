# Email agent behavior — edit this to customize what the agent does.
# Secrets and infra (API keys, paths) live in .env, not here.

agent:
  background: |
    I'm a software engineer who wants help triaging and responding to email.

  triage_instructions: |
    Classify RESPOND only when a real person asks something actionable of this
    mailbox. Automated, transactional, or bulk mail is never RESPOND, even when
    it contains links or calls to action.

    Emails that are not worth responding to (ignore):
    - Marketing newsletters, promotional or bulk emails, social-network mail
    - Spam or suspicious emails
    - Any automated/no-reply system mail, even when it asks to click or confirm

    Emails worth knowing about but needing no reply (notify):
    - Build system notifications, deployments, GitHub notifications
    - Delivery/transaction confirmations, receipts, subscription or renewal
      reminders
    - FYI announcements that ask nothing of the reader
    - When unsure between notify and respond, choose notify.

    Emails that are worth responding to (respond):
    - A direct question, request, or inquiry ("renseignement") written by a real
      person (colleagues, clients, candidates, interns, the public)
    - Requests for information, documents, attestations, or a status update
    - Prospective or current interns/candidates asking about positions, the company,
      or next steps
    - Meeting requests requiring confirmation
    - Bug reports or technical questions about documentation, code, or APIs
    - Requests from management or clients requiring acknowledgment
    - Personal messages from an individual that expect a reply

  response_preferences: |
    Use professional and concise language. If the email mentions a deadline,
    explicitly acknowledge and reference the deadline in your response.

    When responding to technical questions that require investigation:
    - Clearly state whether you will investigate or who you will ask
    - Provide an estimated timeline for more information

    When responding to collaboration or project-related requests:
    - Acknowledge any existing work or materials mentioned (drafts, slides, docs)
    - Explicitly mention reviewing these materials before or during the meeting

  writing_style_default: |
    Neutral professional voice until learned from sent mail.

capabilities:
  email: true       # write_email + Done — keep on
  calendar: false   # schedule_meeting + check_calendar_availability — off for now
  inbox: false      # labels, archive, read/unread, trash — off until Phase 5 is enabled
  drafts: false     # create Gmail drafts without sending — off until Phase 5 is enabled

# Optional automatic organization for ignored emails. Requires the inbox capability.
auto_organize:
  enabled: false
  ignored_label: Auto/Ignored

style_learning:
  enabled: true
  max_samples: 8
