templates:
- name: attestation_reply
  subject: null
  body: |
    Bonjour {{name}},

    Merci pour votre demande d'attestation de travail. Je confirme la prise en
    charge de votre demande et reviens vers vous avec le document signé dans les
    plus brefs délais.

    Pourriez-vous me confirmer l'adresse exacte à faire figurer sur l'attestation
    ainsi que le motif de la demande ?

    Bien cordialement,
  variables:
  - name
- name: conge_reply
  subject: null
  body: |
    Bonjour {{name}},

    Merci pour votre demande de congé. Je confirme la bonne réception et reviens
    vers vous après validation avec le responsable concerné.

    Pourriez-vous me préciser les dates exactes souhaitées (début et fin) ainsi
    que le motif si nécessaire ?

    Bien cordialement,
  variables:
  - name
- name: rdv_reply
  subject: null
  body: |
    Bonjour {{name}},

    Merci pour votre message. Je confirme la prise en compte de votre demande de
    rendez-vous et reviens vers vous avec un créneau adapté dans les plus brefs
    délais.

    Pourriez-vous m'indiquer vos disponibilités ainsi que le format souhaité
    (présentiel ou visioconférence) ?

    Bien cordialement,
  variables:
  - name
- name: candidate_ack_reply
  subject: null
  body: |
    Bonjour {{name}},

    Merci pour votre candidature et l'intérêt porté à notre équipe. Votre dossier
    a bien été reçu et sera étudié avec attention.

    Pour faciliter le traitement, pouvez-vous confirmer le poste ou le type de stage
    visé, vos dates de disponibilité, et joindre votre CV à jour si ce n'est pas
    déjà fait ?

    Nous revenons vers vous dès qu'une prochaine étape est définie.

    Bien cordialement,
  variables:
  - name
- name: finance_request_reply
  subject: null
  body: |
    Bonjour {{name}},

    Merci pour votre message. Votre demande liée à la facturation ou au paiement a
    bien été transmise au suivi financier.

    Pour éviter tout aller-retour, pouvez-vous confirmer le numéro de facture, le
    montant concerné, la société de facturation et la date d'échéance ou de paiement
    attendue ?

    Nous vous répondons dès vérification des éléments.

    Bien cordialement,
  variables:
  - name
- name: quote_request_reply
  subject: null
  body: |
    Bonjour {{name}},

    Merci pour votre demande de devis. Nous avons bien reçu votre besoin et préparons
    une réponse adaptée.

    Pouvez-vous nous préciser le périmètre attendu, le volume estimé, l'échéance
    souhaitée et toute contrainte particulière à prendre en compte ?

    Nous revenons vers vous avec une proposition structurée dans les meilleurs délais.

    Bien cordialement,
  variables:
  - name
