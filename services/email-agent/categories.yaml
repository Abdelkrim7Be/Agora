templates:
- name: attestation_reply
  subject: null
  body: "Bonjour {{name}},\n\nMerci pour votre demande d'attestation de travail. Je\
    \ confirme la prise en\ncharge de votre demande et reviens vers vous avec le document\
    \ sign\xE9 dans les\nplus brefs d\xE9lais.\n\nPourriez-vous me confirmer l'adresse\
    \ exacte \xE0 faire figurer sur l'attestation\nainsi que le motif de la demande\
    \ ?\n\nBien cordialement,\n"
  variables:
  - name
- name: conge_reply
  subject: null
  body: "Bonjour {{name}},\n\nMerci pour votre demande de cong\xE9. Je confirme la\
    \ bonne r\xE9ception et reviens\nvers vous apr\xE8s validation avec le responsable\
    \ concern\xE9.\n\nPourriez-vous me pr\xE9ciser les dates exactes souhait\xE9es\
    \ (d\xE9but et fin) ainsi\nque le motif si n\xE9cessaire ?\n\nBien cordialement,\n"
  variables:
  - name
- name: rdv_reply
  subject: null
  body: "Bonjour {{name}},\n\nMerci pour votre message. Je confirme la prise en compte\
    \ de votre demande de\nrendez-vous et reviens vers vous avec un cr\xE9neau adapt\xE9\
    \ dans les plus brefs\nd\xE9lais.\n\nPourriez-vous m'indiquer vos disponibilit\xE9\
    s ainsi que le format souhait\xE9\n(pr\xE9sentiel ou visioconf\xE9rence) ?\n\n\
    Bien cordialement,\n"
  variables:
  - name
- name: candidate_ack_reply
  subject: null
  body: "Bonjour {{name}},\n\nMerci pour votre candidature et l'int\xE9r\xEAt port\xE9\
    \ \xE0 notre \xE9quipe. Votre dossier\na bien \xE9t\xE9 re\xE7u et sera \xE9tudi\xE9\
    \ avec attention.\n\nPour faciliter le traitement, pouvez-vous confirmer le poste\
    \ ou le type de stage\nvis\xE9, vos dates de disponibilit\xE9, et joindre votre\
    \ CV \xE0 jour si ce n'est pas\nd\xE9j\xE0 fait ?\n\nNous revenons vers vous d\xE8\
    s qu'une prochaine \xE9tape est d\xE9finie.\n\nBien cordialement,\n"
  variables:
  - name
- name: finance_request_reply
  subject: null
  body: "Bonjour {{name}},\n\nMerci pour votre message. Votre demande li\xE9e \xE0\
    \ la facturation ou au paiement a\nbien \xE9t\xE9 transmise au suivi financier.\n\
    \nPour \xE9viter tout aller-retour, pouvez-vous confirmer le num\xE9ro de facture,\
    \ le\nmontant concern\xE9, la soci\xE9t\xE9 de facturation et la date d'\xE9ch\xE9\
    ance ou de paiement\nattendue ?\n\nNous vous r\xE9pondons d\xE8s v\xE9rification\
    \ des \xE9l\xE9ments.\n\nBien cordialement,\n"
  variables:
  - name
- name: quote_request_reply
  subject: null
  body: "Bonjour {{name}},\n\nMerci pour votre demande de devis. Nous avons bien re\xE7\
    u votre besoin et pr\xE9parons\nune r\xE9ponse adapt\xE9e.\n\nPouvez-vous nous\
    \ pr\xE9ciser le p\xE9rim\xE8tre attendu, le volume estim\xE9, l'\xE9ch\xE9ance\n\
    souhait\xE9e et toute contrainte particuli\xE8re \xE0 prendre en compte ?\n\n\
    Nous revenons vers vous avec une proposition structur\xE9e dans les meilleurs\
    \ d\xE9lais.\n\nBien cordialement,\n"
  variables:
  - name
