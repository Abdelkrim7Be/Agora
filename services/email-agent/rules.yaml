# Email automation rules — opt-in. With enabled: false this file changes nothing.

enabled: false

rules:
  # - name: archive newsletters
  #   enabled: true
  #   when:
  #     sender_domain: ["newsletter.example.com"]
  #     subject_contains: ["weekly digest"]
  #   then:
  #     labels: ["Auto/Newsletters"]
