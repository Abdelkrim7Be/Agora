# Email automation rules — opt-in deterministic actions run BEFORE the triage LLM.
# Matched rules act through the normal tool path (dry-run + security policy still apply).
#
# Matching predicates (all provided must hold): sender_contains, sender_domain,
# subject_contains, labels (Gmail labelIds, e.g. CATEGORY_PROMOTIONS / CATEGORY_SOCIAL).
# Actions: labels (apply), archive, mark_read, notify, respond, snooze_days.

enabled: true

rules:
  # Promotional mail: label, mark read, and archive out of the inbox.
  - name: archive promotions
    enabled: true
    when:
      labels: ["CATEGORY_PROMOTIONS"]
    then:
      labels: ["Auto/Promotions"]
      mark_read: true
      archive: true

  # Social notifications: label, mark read, and archive.
  - name: archive social
    enabled: true
    when:
      labels: ["CATEGORY_SOCIAL"]
    then:
      labels: ["Auto/Social"]
      mark_read: true
      archive: true

  # Bulk "forums" / mailing-list traffic: label and archive, keep unread.
  - name: archive forums
    enabled: true
    when:
      labels: ["CATEGORY_FORUMS"]
    then:
      labels: ["Auto/Forums"]
      archive: true

digest:
  enabled: false
  hour: 18
  statuses:
    - notify
    - pending_approval

snooze:
  enabled: false
  label_prefix: Snoozed
  max_resurface_per_run: 20

follow_ups:
  enabled: false
  label: Awaiting Reply
  after_days: 3
  max_results: 10
  nudge: Just following up on this.

# Dynamic learning: every human correction (ignore / edit / feedback on a draft)
# appends a disabled rule suggestion to the path below. Promote suggestions into
# the `rules` list above (one click in the Rules tab) to make them active.
learning:
  enabled: true
  suggestions_path: logs/rule_suggestions.jsonl
