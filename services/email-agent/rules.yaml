digest:
  enabled: false
  hour: 18
  statuses:
    - notify
    - pending_approval

snooze:
  enabled: false
  label_prefix: Snoozed
  max_resurface_per_run: 20

follow_ups:
  enabled: false
  label: Awaiting Reply
  after_days: 3
  max_results: 10
  nudge: Just following up on this.

learning:
  enabled: false
  suggestions_path: logs/rule_suggestions.jsonl
