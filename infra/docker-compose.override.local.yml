# Local dev sends real mail (AGENT_DRY_RUN=false), and the connected test mailbox
# also holds messages from real third parties. Both processes that can reach the
# Gmail send API therefore run with an outbound allow list naming the only two
# mailboxes this environment may ever write to; anything else raises before the
# message is built. The security service enforces the same pair at policy level
# (see SECURITY_POLICY_PATH below) — this is the layer underneath it.
x-outbound-allowlist: &outbound_allowlist
  AGENT_OUTBOUND_ALLOWLIST: "agora.test.inbox@gmail.com,abdelkrimbellagnech28@gmail.com"

# Docker GPU passthrough is not configured on this machine, so an Ollama running
# inside Compose falls back to CPU and a draft takes minutes. The host runs Ollama
# as a systemd service with the GPU, so both containerised Ollama services move
# behind a profile (not started by default) and every LLM caller reaches the host
# through the docker host gateway instead. Start them with `--profile docker-ollama`
# if the host service is not available.
x-host-ollama: &host_ollama
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  ollama:
    profiles: ["docker-ollama"]
    gpus: !reset []
    environment:
      NVIDIA_VISIBLE_DEVICES: !reset ""
      NVIDIA_DRIVER_CAPABILITIES: !reset ""

  ollama-init:
    profiles: ["docker-ollama"]

  email-agent:
    <<: *host_ollama
    volumes:
      - ../services/email-agent/credentials.json:/app/credentials.json:ro
      # The live-test harness runs inside this container so the sender's OAuth
      # token never has to leave it. Not part of the image — test-only surface.
      - ../services/email-agent/scripts:/app/scripts:ro
    environment:
      <<: *outbound_allowlist
      AGENT_DRY_RUN: "false"
      AGENT_DEFAULT_SEND_MODE: "live"
      AGENT_LLM_CONFIG_PATH: config/llm.local-host.yaml
      GMAIL_OAUTH_REDIRECT_URI: http://localhost:${GATEWAY_PORT:-8081}/api/agent/connect/gmail/callback
      # Prod leaves this empty (Traefik puts web + gateway on one origin, so a
      # relative redirect from the OAuth callback just works). Local dev splits
      # them across ports, so the callback needs to know where the web app is.
      AGENT_APP_BASE_URL: http://localhost:${WEB_PORT:-5173}
    # The base file waits for ollama-init, which no longer runs — without this the
    # agent would block forever on a dependency that is behind a profile.
    depends_on: !override
      postgres:
        condition: service_healthy
      email-agent-migrate:
        condition: service_completed_successfully
      security:
        condition: service_healthy

  security:
    <<: *host_ollama
    volumes:
      - ../services/security/policy.live-test.yaml:/app/policy.live-test.yaml:ro
    environment:
      SECURITY_POLICY_PATH: policy.live-test.yaml
      SECURITY_SANITIZE_ENDPOINT: http://host.docker.internal:11434/v1

  gateway:
    environment:
      # Follows WEB_PORT so a port change cannot silently break browser login:
      # the SPA's Origin has to be on this list or /auth/login answers 403, and
      # curl without an Origin header still succeeds, which makes it look like
      # the UI is at fault rather than the allow list.
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
      GATEWAY_APP_URL: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${GATEWAY_PORT:-8081}:8080"

  web:
    ports:
      - "${WEB_PORT:-5173}:8080"

  # docker-compose.yml has no poller service at all (only the demo overlay
  # does, tuned for a single live mailbox). Without one, fetched inbox mail
  # never becomes drafts/notifications outside a manual "Verifier Gmail"
  # click — src/poller.py already loops every connected instance via
  # agent_instance_context, so it works unmodified for multi-instance local dev.
  poller:
    <<: *host_ollama
    build:
      context: ../services/email-agent
      network: host
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    command: ["python", "-m", "src.poller"]
    env_file:
      - ../services/email-agent/.env
    environment:
      <<: *outbound_allowlist
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://agora_email_agent:${AGENT_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-agora}
      AGENT_RUN_MIGRATIONS: "false"
      AGENT_STORAGE_BACKEND: postgres
      AGENT_RUN_REGISTRY_BACKEND: postgres
      TENANT_MODE: ${TENANT_MODE:-single}
      AGENT_DEFAULT_USER_ID: ${AGENT_DEFAULT_USER_ID:-owner}
      GMAIL_TOKEN_STORE_PATH: /app/data/gmail_tokens.json
      AGENT_MEDIA_DIR: /app/data/media
      GMAIL_CREDENTIALS_PATH: credentials.json
      AGENT_TOKEN_ENCRYPTION_KEY: ${AGENT_TOKEN_ENCRYPTION_KEY}
      AGENT_SECURITY_ENABLED: "true"
      AGENT_SECURITY_URL: http://security:8001
      AGENT_LLM_PROFILE: local
      AGENT_LLM_CONFIG_PATH: config/llm.local-host.yaml
      OPENAI_API_KEY: ollama-local
      AGENT_DRY_RUN: ${AGENT_DRY_RUN:-false}
      AGENT_DEFAULT_SEND_MODE: "live"
      AGENT_POLL_INTERVAL_MIN: "1"
      GMAIL_POLLING_FALLBACK_ENABLED: "true"
      AGENT_JOB_QUEUE_ENABLED: "false"
    volumes:
      - agent_data:/app/data
      - ../services/email-agent/credentials.json:/app/credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      email-agent-migrate:
        condition: service_completed_successfully
      security:
        condition: service_healthy
    networks:
      - agora
