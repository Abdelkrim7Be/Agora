global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: email-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["email-agent:8000"]

  - job_name: security
    metrics_path: /metrics
    static_configs:
      - targets: ["security:8001"]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
