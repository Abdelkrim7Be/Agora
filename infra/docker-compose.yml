services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agora

  security:
    build:
      context: ../services/security
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SECURITY_API_HOST: 0.0.0.0
      SECURITY_API_PORT: 8001
      SECURITY_POLICY_PATH: policy.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - agora

  email-agent:
    build:
      context: ../services/email-agent
    env_file:
      - ../services/email-agent/.env
    environment:
      AGENT_CHECKPOINTS_DB: /app/data/checkpoints.db
      AGENT_STORE_DB: /app/data/store.db
      AGENT_SECURITY_ENABLED: "true"
      AGENT_SECURITY_URL: http://security:8001
      AGENT_SECURITY_TIMEOUT: 10
    volumes:
      - agent_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      security:
        condition: service_healthy
    networks:
      - agora

  gateway:
    build:
      context: ../services/gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET}
      GATEWAY_OWNER_USERNAME: ${GATEWAY_OWNER_USERNAME}
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD}
      GATEWAY_VIEWER_USERNAME: ${GATEWAY_VIEWER_USERNAME}
      GATEWAY_VIEWER_PASSWORD: ${GATEWAY_VIEWER_PASSWORD}
      GATEWAY_UPSTREAM_EMAIL_AGENT_URL: http://email-agent:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      email-agent:
        condition: service_healthy
    networks:
      - agora

volumes:
  postgres_data:
  agent_data:

networks:
  agora:
