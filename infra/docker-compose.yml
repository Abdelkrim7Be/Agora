services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agora

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agora

  security:
    build:
      context: ../services/security
      network: host
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SECURITY_SECRET_MANAGER_BACKEND: ${SECURITY_SECRET_MANAGER_BACKEND:-disabled}
      SECURITY_SECRET_MANAGER_REQUIRED: ${SECURITY_SECRET_MANAGER_REQUIRED:-false}
      SECURITY_SECRET_BUNDLE_PATH: ${SECURITY_SECRET_BUNDLE_PATH:-}
      SECURITY_SECRET_MANAGER_URL: ${SECURITY_SECRET_MANAGER_URL:-}
      SECURITY_SECRET_MANAGER_PATH: ${SECURITY_SECRET_MANAGER_PATH:-}
      SECURITY_SECRET_MANAGER_TOKEN_FILE: ${SECURITY_SECRET_MANAGER_TOKEN_FILE:-}
      SECURITY_API_HOST: 0.0.0.0
      SECURITY_API_PORT: 8001
      SECURITY_POLICY_PATH: policy.yaml
      REDIS_URL: redis://redis:6379/0
      SECURITY_RATELIMIT_BACKEND: redis
      TENANT_MODE: ${TENANT_MODE:-single}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agora

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    networks:
      - agora

  email-agent:
    build:
      context: ../services/email-agent
      network: host
    env_file:
      - ../services/email-agent/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agora}
      AGENT_SECRET_MANAGER_BACKEND: ${AGENT_SECRET_MANAGER_BACKEND:-disabled}
      AGENT_SECRET_MANAGER_REQUIRED: ${AGENT_SECRET_MANAGER_REQUIRED:-false}
      AGENT_SECRET_BUNDLE_PATH: ${AGENT_SECRET_BUNDLE_PATH:-}
      AGENT_SECRET_MANAGER_URL: ${AGENT_SECRET_MANAGER_URL:-}
      AGENT_SECRET_MANAGER_PATH: ${AGENT_SECRET_MANAGER_PATH:-}
      AGENT_SECRET_MANAGER_TOKEN_FILE: ${AGENT_SECRET_MANAGER_TOKEN_FILE:-}
      AGENT_LLM_PROFILE: ${AGENT_LLM_PROFILE:-dev}
      AGENT_STORAGE_BACKEND: postgres
      AGENT_RUN_REGISTRY_BACKEND: postgres
      TENANT_MODE: ${TENANT_MODE:-single}
      AGENT_DEFAULT_USER_ID: ${AGENT_DEFAULT_USER_ID:-default}
      GMAIL_TOKEN_STORE_PATH: /app/data/gmail_tokens.json
      GMAIL_WEBHOOK_ENABLED: ${GMAIL_WEBHOOK_ENABLED:-false}
      GMAIL_WEBHOOK_TOPIC: ${GMAIL_WEBHOOK_TOPIC:-}
      GMAIL_WEBHOOK_SECRET: ${GMAIL_WEBHOOK_SECRET:-}
      GMAIL_POLLING_FALLBACK_ENABLED: ${GMAIL_POLLING_FALLBACK_ENABLED:-true}
      AGENT_TOKEN_ENCRYPTION_KEY: ${AGENT_TOKEN_ENCRYPTION_KEY}
      AGENT_CHECKPOINTS_DB: /app/data/checkpoints.db
      AGENT_STORE_DB: /app/data/store.db
      AGENT_DRY_RUN: "false"         # real sends/mutations enabled — every send still passes HITL + security /authorize
      AGENT_SECURITY_ENABLED: "true"
      AGENT_SECURITY_URL: http://security:8001
      AGENT_SECURITY_TIMEOUT: 10
      # Browser Gmail OAuth onboarding. Credentials mounted read-only (secret, not baked in the image).
      # Redirect URI points at the gateway — the browser cannot reach email-agent directly.
      GMAIL_CREDENTIALS_PATH: credentials.json
      GMAIL_OAUTH_REDIRECT_URI: http://localhost:8080/api/agent/connect/gmail/callback
      GMAIL_OAUTH_STATE_SECRET: ${GMAIL_OAUTH_STATE_SECRET:-${AGENT_TOKEN_ENCRYPTION_KEY}}
    volumes:
      - agent_data:/app/data
      - ../services/email-agent/credentials.json:/app/credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      security:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - agora

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile.runtime
      network: host
    ports:
      - "8080:8080"
    environment:
      GATEWAY_SECRET_DIR: ${GATEWAY_SECRET_DIR:-/run/secrets/agora-gateway/}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET}
      GATEWAY_OWNER_USERNAME: ${GATEWAY_OWNER_USERNAME}
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD}
      GATEWAY_VIEWER_USERNAME: ${GATEWAY_VIEWER_USERNAME}
      GATEWAY_VIEWER_PASSWORD: ${GATEWAY_VIEWER_PASSWORD}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
      GATEWAY_UPSTREAM_EMAIL_AGENT_URL: http://email-agent:8000
      # Allow the browser control panel (served by the web service) to call the gateway.
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      email-agent:
        condition: service_healthy
    networks:
      - agora

  web:
    build:
      context: ../services/web
      network: host
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - agora

volumes:
  postgres_data:
  redis_data:
  agent_data:

networks:
  agora:
