services:
  ingress:
    image: traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    profiles: ["production"]
    restart: unless-stopped
    user: "${TRAEFIK_UID:-1000}:${TRAEFIK_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    command:
      - --api.dashboard=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --entrypoints.websecure.address=:8443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "443:8443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${AGORA_TLS_CERT_FILE:-./traefik/certs/tls.crt}:/certs/tls.crt:ro
      - ${AGORA_TLS_KEY_FILE:-./traefik/certs/tls.key}:/certs/tls.key:ro
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    depends_on:
      web:
        condition: service_healthy
    networks:
      - agora

  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agora

  postgres-agent-role:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AGENT_POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    command: ["/bin/sh", "/scripts/ensure-agent-role.sh"]
    volumes:
      - ./postgres/ensure-agent-role.sh:/scripts/ensure-agent-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agora

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agora

  security:
    build:
      context: ../services/security
      network: host
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      # Local-first quarantine classifier (Ollama, OpenAI-compatible endpoint).
      # Must match the email-agent's model: a second resident model does not fit
      # beside it on a small GPU, and the two evict each other on every call.
      SECURITY_SANITIZE_MODEL: ${SECURITY_SANITIZE_MODEL:-openai:qwen3:4b-4k}
      SECURITY_SANITIZE_ENDPOINT: ${SECURITY_SANITIZE_ENDPOINT:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama-local}
      SECURITY_SECRET_MANAGER_BACKEND: ${SECURITY_SECRET_MANAGER_BACKEND:-disabled}
      SECURITY_SECRET_MANAGER_REQUIRED: ${SECURITY_SECRET_MANAGER_REQUIRED:-false}
      SECURITY_SECRET_BUNDLE_PATH: ${SECURITY_SECRET_BUNDLE_PATH:-}
      SECURITY_SECRET_MANAGER_URL: ${SECURITY_SECRET_MANAGER_URL:-}
      SECURITY_SECRET_MANAGER_PATH: ${SECURITY_SECRET_MANAGER_PATH:-}
      SECURITY_SECRET_MANAGER_TOKEN_FILE: ${SECURITY_SECRET_MANAGER_TOKEN_FILE:-}
      SECURITY_API_HOST: 0.0.0.0
      SECURITY_API_PORT: 8001
      SECURITY_POLICY_PATH: policy.yaml
      REDIS_URL: redis://redis:6379/0
      SECURITY_RATELIMIT_BACKEND: redis
      TENANT_MODE: ${TENANT_MODE:-single}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agora

  ollama:
    image: ollama/ollama:0.32.1
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    # No `gpus: all` here on purpose. It aborts the entire `docker compose up`
    # on a host without an accelerator ("failed to discover GPU vendor from
    # CDI"), which is every ordinary OVH instance. Ollama runs on CPU, just
    # slower. On a GPU host, add the overlay:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - agora

  ollama-init:
    image: ollama/ollama:0.32.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    # The image's entrypoint is `ollama`, so a bare command list is passed to it
    # as arguments — this ran `ollama sh -c ...` and died with "unknown command
    # sh", meaning a clean deploy never created the model the agent needs.
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:3b && ollama create qwen2.5:3b-8k -f /models/qwen2.5-3b-8k.Modelfile"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/qwen2.5-3b-8k.Modelfile:/models/qwen2.5-3b-8k.Modelfile:ro
    networks:
      - agora
    restart: "no"

  litellm:
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    # Cloud LLM proxy — only needed by the explicit `prod` LLM profile. The
    # platform is local-first (Ollama), so this stays out of the default stack.
    profiles: ["cloud"]
    image: ghcr.io/berriai/litellm:v1.86.2
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    networks:
      - agora

  email-agent-migrate:
    build:
      context: ../services
      dockerfile: email-agent/Dockerfile
      network: host
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agora}
      AGENT_RUN_MIGRATIONS: "true"
      AGENT_RUN_REGISTRY_BACKEND: postgres
      AGENT_COST_BACKEND: postgres
    command: ["true"]
    depends_on:
      postgres-agent-role:
        condition: service_completed_successfully
    networks:
      - agora

  email-agent:
    build:
      context: ../services
      dockerfile: email-agent/Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    env_file:
      - ../services/email-agent/.env
    environment:
      DATABASE_URL: postgresql://agora_email_agent:${AGENT_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-agora}
      AGENT_RUN_MIGRATIONS: "false"
      AGENT_SECRET_MANAGER_BACKEND: ${AGENT_SECRET_MANAGER_BACKEND:-disabled}
      AGENT_SECRET_MANAGER_REQUIRED: ${AGENT_SECRET_MANAGER_REQUIRED:-false}
      AGENT_SECRET_BUNDLE_PATH: ${AGENT_SECRET_BUNDLE_PATH:-}
      AGENT_SECRET_MANAGER_URL: ${AGENT_SECRET_MANAGER_URL:-}
      AGENT_SECRET_MANAGER_PATH: ${AGENT_SECRET_MANAGER_PATH:-}
      AGENT_SECRET_MANAGER_TOKEN_FILE: ${AGENT_SECRET_MANAGER_TOKEN_FILE:-}
      AGENT_LLM_PROFILE: ${AGENT_LLM_PROFILE:-local}
      AGENT_LLM_CONFIG_PATH: ${AGENT_LLM_CONFIG_PATH:-config/llm.local-docker.yaml}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama-local}
      AGENT_STORAGE_BACKEND: postgres
      AGENT_RUN_REGISTRY_BACKEND: postgres
      # Shared with the poller: the inbox listing cache and the Gmail hourly call
      # budget are per-mailbox facts, and a per-process copy of either is wrong.
      REDIS_URL: redis://redis:6379/0
      # System mail: approver reminders, SLA escalation and component alerts. Sent
      # through the connected mailbox, so it stays off until a stack opts in.
      AGENT_NOTIFY_ENABLED: ${AGENT_NOTIFY_ENABLED:-false}
      AGENT_NOTIFY_APP_BASE_URL: ${AGENT_NOTIFY_APP_BASE_URL:-}
      AGENT_ALERTS_ENABLED: ${AGENT_ALERTS_ENABLED:-false}
      AGENT_ALERT_ADMIN_RECIPIENT: ${AGENT_ALERT_ADMIN_RECIPIENT:-}
      TENANT_MODE: ${TENANT_MODE:-single}
      AGENT_DEFAULT_USER_ID: ${AGENT_DEFAULT_USER_ID:-default}
      GMAIL_TOKEN_STORE_PATH: /app/data/gmail_tokens.json
      # The default instance keeps the pre-multi-instance token path, which is
      # relative to the service root — i.e. inside the container's own writable
      # layer. Left there, its Gmail grant is invisible to the poller and is lost
      # on the next image build; it belongs on the shared volume like every other.
      GMAIL_TOKEN_PATH: /app/data/token.json
      AGENT_MEDIA_DIR: /app/data/media
      GMAIL_WEBHOOK_ENABLED: ${GMAIL_WEBHOOK_ENABLED:-false}
      GMAIL_WEBHOOK_TOPIC: ${GMAIL_WEBHOOK_TOPIC:-}
      GMAIL_WEBHOOK_SECRET: ${GMAIL_WEBHOOK_SECRET:-}
      AGENT_WEBHOOK_FALLBACK_POLL_MIN: ${AGENT_WEBHOOK_FALLBACK_POLL_MIN:-10}
      GMAIL_POLLING_FALLBACK_ENABLED: ${GMAIL_POLLING_FALLBACK_ENABLED:-true}
      GMAIL_WATCH_RENEW_HOURS: ${GMAIL_WATCH_RENEW_HOURS:-24}
      GMAIL_WATCH_RENEW_MARGIN_HOURS: ${GMAIL_WATCH_RENEW_MARGIN_HOURS:-12}
      AGENT_TOKEN_ENCRYPTION_KEY: ${AGENT_TOKEN_ENCRYPTION_KEY}
      AGENT_CHECKPOINTS_DB: /app/data/checkpoints.db
      AGENT_STORE_DB: /app/data/store.db
      AGENT_DRY_RUN: ${AGENT_DRY_RUN:-true}
      AGENT_SECURITY_ENABLED: "true"
      AGENT_SECURITY_URL: http://security:8001
      AGENT_SECURITY_TIMEOUT: 10
      GATEWAY_AGENT_SHARED_SECRET: ${GATEWAY_AGENT_SHARED_SECRET}
      # Browser Gmail OAuth onboarding. Demo/live compose mounts credentials.json explicitly.
      # Redirect URI points at the gateway — the browser cannot reach email-agent directly.
      GMAIL_CREDENTIALS_PATH: ${GMAIL_CREDENTIALS_PATH:-credentials.json}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-https://localhost/api/agent/connect/gmail/callback}
      GMAIL_OAUTH_STATE_SECRET: ${GMAIL_OAUTH_STATE_SECRET:-${AGENT_TOKEN_ENCRYPTION_KEY}}
      # Outlook is opt-in per instance; blank here keeps Gmail-only deployments unchanged.
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
      OUTLOOK_TENANT: ${OUTLOOK_TENANT:-common}
      OUTLOOK_OAUTH_REDIRECT_URI: ${OUTLOOK_OAUTH_REDIRECT_URI:-https://localhost/api/agent/connect/outlook/callback}
    volumes:
      - agent_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      email-agent-migrate:
        condition: service_completed_successfully
      security:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - agora

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      GATEWAY_SECRET_DIR: ${GATEWAY_SECRET_DIR:-/run/secrets/agora-gateway/}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET}
      GATEWAY_AGENT_SHARED_SECRET: ${GATEWAY_AGENT_SHARED_SECRET}
      # Invitation links point at the public web app; SMTP is optional — with no
      # relay the endpoints return the setup link instead of mailing it.
      # Invitation links are built from this, so it must be the URL a person can
      # actually open in a browser — scheme, host AND port. Override it in .env
      # for any deployment that is not the local compose stack.
      GATEWAY_APP_URL: ${GATEWAY_APP_URL:-http://localhost:${WEB_PORT:-5173}}
      GATEWAY_INVITE_EXPIRY_HOURS: ${GATEWAY_INVITE_EXPIRY_HOURS:-48}
      GATEWAY_SMTP_HOST: ${GATEWAY_SMTP_HOST:-}
      GATEWAY_SMTP_PORT: ${GATEWAY_SMTP_PORT:-587}
      GATEWAY_SMTP_USERNAME: ${GATEWAY_SMTP_USERNAME:-}
      GATEWAY_SMTP_PASSWORD: ${GATEWAY_SMTP_PASSWORD:-}
      GATEWAY_SMTP_FROM: ${GATEWAY_SMTP_FROM:-}
      GATEWAY_JWT_TTL_MINUTES: ${GATEWAY_JWT_TTL_MINUTES:-15}
      GATEWAY_JWT_REFRESH_TTL_DAYS: ${GATEWAY_JWT_REFRESH_TTL_DAYS:-7}
      GATEWAY_JWT_SECURE_COOKIES: ${GATEWAY_JWT_SECURE_COOKIES:-true}
      GATEWAY_OWNER_USERNAME: ${GATEWAY_OWNER_USERNAME}
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD}
      GATEWAY_VIEWER_USERNAME: ${GATEWAY_VIEWER_USERNAME}
      GATEWAY_VIEWER_PASSWORD: ${GATEWAY_VIEWER_PASSWORD}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
      GATEWAY_UPSTREAM_EMAIL_AGENT_URL: http://email-agent:8000
      # Allow the browser control panel (served by the web service) to call the gateway.
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-https://localhost}
      GATEWAY_LOGIN_RATELIMIT_ENABLED: ${GATEWAY_LOGIN_RATELIMIT_ENABLED:-true}
      GATEWAY_LOGIN_RATELIMIT_WINDOW_SECONDS: ${GATEWAY_LOGIN_RATELIMIT_WINDOW_SECONDS:-900}
      GATEWAY_LOGIN_RATELIMIT_MAX_FAILURES: ${GATEWAY_LOGIN_RATELIMIT_MAX_FAILURES:-5}
      GATEWAY_LOGIN_RATELIMIT_GLOBAL_MAX_FAILURES: ${GATEWAY_LOGIN_RATELIMIT_GLOBAL_MAX_FAILURES:-100}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      email-agent:
        condition: service_healthy
    # Without this nothing notices a gateway that started but never became
    # usable, and web/ingress happily route to it.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - agora

  prometheus:
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      email-agent:
        condition: service_healthy
      security:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - agora

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - agora

  web:
    build:
      context: ../services/web-react
      network: host
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this image resolves localhost to ::1 first and
      # nginx binds IPv4 only, so the probe never succeeded and the container
      # stayed unhealthy forever — which blocks ingress via depends_on.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - agora

volumes:
  postgres_data:
  redis_data:
  agent_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  agora:
