# Demo-only overrides (auto-merged by `docker compose`). Not committed-critical:
#   - mounts the real Gmail OAuth files into the agent so it can send
#   - enables REAL sends (AGENT_DRY_RUN=false) so an approved reply actually arrives
#   - 1-minute poll so a live-sent email is picked up fast without tripping
#     Google's per-user abuse limiter (6s polling earned sliding 30-min bans)
# Remove this file (or set AGENT_DRY_RUN=true) to go back to safe dry-run mode.
services:
  # Use the host Ollama systemd service for local GPU inference.
  # Docker GPU passthrough is not configured on this machine.
  ollama:
    profiles: ["docker-ollama"]

  ollama-init:
    profiles: ["docker-ollama"]

  # This machine runs Ollama as a host service (no docker-ollama profile), so the
  # security quarantine classifier reaches it through the docker host gateway.
  security:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SECURITY_SANITIZE_ENDPOINT: http://host.docker.internal:11434/v1

  # Host port 8080 is taken by another project (edun7), so expose the gateway on
  # 8090 instead. `!override` replaces the base port list (otherwise it'd merge).
  gateway:
    ports: !override
      - "8090:8080"

  # Host port 3000 is also taken by another project; serve the UI on 3001.
  web:
    ports: !override
      - "3001:80"

  email-agent:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # dry-run while seeding the demo; flip back to "false" for the live-send proof
      AGENT_DRY_RUN: "true"
      AGENT_LLM_PROFILE: local
      AGENT_LLM_CONFIG_PATH: config/llm.local-host.yaml
      OPENAI_API_KEY: ollama-local
      AGENT_POLL_INTERVAL_MIN: "1"
      GMAIL_TOKEN_PATH: /app/data/token.json
      GMAIL_OAUTH_REDIRECT_URI: http://localhost:8090/api/agent/connect/gmail/callback
    volumes:
      - ../services/email-agent/credentials.json:/app/credentials.json
    depends_on: !override
      postgres:
        condition: service_healthy
      security:
        condition: service_healthy

  # Live demo poller: watches agora.test.inbox and turns real incoming mail into
  # pending-approval runs in the same Postgres the API serves the UI from.
  poller:
    build:
      context: ../services/email-agent
      network: host
    command: ["python", "-m", "src.poller"]
    env_file:
      - ../services/email-agent/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-agora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agora}
      AGENT_STORAGE_BACKEND: postgres
      AGENT_RUN_REGISTRY_BACKEND: postgres
      TENANT_MODE: ${TENANT_MODE:-single}
      # Align the poller's default tenant with the gateway's owner login so the
      # runs it creates are visible to that user and it resolves /app/token.json.
      AGENT_DEFAULT_USER_ID: ${AGENT_DEFAULT_USER_ID:-owner}
      GMAIL_TOKEN_STORE_PATH: /app/data/gmail_tokens.json
      GMAIL_CREDENTIALS_PATH: credentials.json
      AGENT_TOKEN_ENCRYPTION_KEY: ${AGENT_TOKEN_ENCRYPTION_KEY}
      AGENT_SECURITY_ENABLED: "true"
      AGENT_SECURITY_URL: http://security:8001
      AGENT_LLM_PROFILE: local
      AGENT_LLM_CONFIG_PATH: config/llm.local-host.yaml
      OPENAI_API_KEY: ollama-local
      # dry-run while seeding the demo; flip back to "false" for the live-send proof
      AGENT_DRY_RUN: "true"
      # 1-minute cadence: 6-second polling ran for days and tripped Google's
      # per-user abuse limiter (sliding 30-min "Retry after" bans on the whole
      # mailbox). One minute is still fast enough for a live demo.
      AGENT_POLL_INTERVAL_MIN: "1"
      GMAIL_TOKEN_PATH: /app/data/token.json
      GMAIL_OAUTH_REDIRECT_URI: http://localhost:8090/api/agent/connect/gmail/callback
      GMAIL_POLLING_FALLBACK_ENABLED: "true"
      # Push mode (see services/email-agent/docs/gmail-push-setup.md). When enabled,
      # polling drops to the slow safety-net cadence automatically.
      GMAIL_WEBHOOK_ENABLED: ${GMAIL_WEBHOOK_ENABLED:-false}
      GMAIL_WEBHOOK_TOPIC: ${GMAIL_WEBHOOK_TOPIC:-}
      GMAIL_WEBHOOK_SECRET: ${GMAIL_WEBHOOK_SECRET:-}
      AGENT_WEBHOOK_FALLBACK_POLL_MIN: ${AGENT_WEBHOOK_FALLBACK_POLL_MIN:-10}
      AGENT_CHECKPOINTS_DB: /app/data/checkpoints.db
      AGENT_STORE_DB: /app/data/store.db
    volumes:
      - agent_data:/app/data
      - ../services/email-agent/credentials.json:/app/credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      security:
        condition: service_healthy
    networks:
      - agora
