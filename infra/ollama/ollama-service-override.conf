# systemd drop-in for a host-run Ollama serving Agora on a small GPU.
#
# Install:
#   sudo install -D -m644 infra/ollama/ollama-service-override.conf \
#        /etc/systemd/system/ollama.service.d/agora.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Why each line, measured on a 4 GB RTX A2000 with qwen3:4b-4k:
#
#   KV_CACHE_TYPE=q8_0   The KV cache is allocated for the entire context window
#                        whether or not it is used. At f16 it took 576 MiB and
#                        left 7 of the model's 37 layers on the CPU; quantised it
#                        takes 306 MiB and 33/37 layers fit on the GPU.
#                        Graph splits fell from 93 to 54.
#   FLASH_ATTENTION=1    Required for the quantised KV cache, and cheaper
#                        attention regardless.
#   KEEP_ALIVE=24h       Keep the model resident. A reload costs ~13 s, which the
#                        next person to click a button pays for.
#
# Result: a warm rewrite went from 224 s (evicting between two models, thinking
# out loud, uncapped) to ~1.2 s of model time.
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_KEEP_ALIVE=24h"
